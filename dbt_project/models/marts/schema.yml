version: 2

models:
  - name: stg_survey_responses
    description: "Staged and deduplicated Stack Overflow Developer Survey 2024 responses. One row per unique ResponseId."
    columns:
      - name: response_id
        tests:
          - unique
          - not_null
      - name: country
        description: "Developer country of residence"
      - name: comp_total_raw
        description: "Numeric CompTotal as entered, in the respondent's own currency. USD conversion is not implemented."
      - name: years_code_pro
        description: "Professional coding experience in years"

  - name: int_languages_exploded
    description: "One row per (response_id, language). Includes wants_to_continue flag."
    columns:
      - name: response_id
        tests:
          - not_null
      - name: language
        tests:
          - not_null
      - name: wants_to_continue
        tests:
          - accepted_values:
              values: [true, false]

  - name: int_databases_exploded
    description: "One row per (response_id, database_name)."
    columns:
      - name: response_id
        tests:
          - not_null
      - name: database_name
        tests:
          - not_null

  - name: mart_salary_analytics
    description: "Salary analytics by cell, append-only per release_id. Readers must use marts.v_salary_analytics."
    columns:
      - name: release_id
        tests:
          - not_null:
              config:
                where: "release_id = '{{ var('release_id') }}'"
      - name: respondent_count
        tests:
          - not_null:
              config:
                where: "release_id = '{{ var('release_id') }}'"
      - name: median_salary
        description: "Median of comp_total_raw for this segment (mixed local currencies, not USD)"

  - name: mart_tech_adoption
    description: "Technology adoption per release_id. Readers must use marts.v_tech_adoption."
    columns:
      - name: tech_name
        tests:
          - not_null:
              config:
                where: "release_id = '{{ var('release_id') }}'"
      - name: release_id
        tests:
          - not_null:
              config:
                where: "release_id = '{{ var('release_id') }}'"
      - name: tech_type
        tests:
          - not_null:
              config:
                where: "release_id = '{{ var('release_id') }}'"
          - accepted_values:
              values: ['Language', 'Database']

  - name: mart_ai_sentiment
    description: "AI sentiment per release_id. Readers must use marts.v_ai_sentiment."
    columns:
      - name: release_id
        tests:
          - not_null:
              config:
                where: "release_id = '{{ var('release_id') }}'"
      - name: respondent_count
        tests:
          - not_null:
              config:
                where: "release_id = '{{ var('release_id') }}'"
